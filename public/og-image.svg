<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090b"/>
      <stop offset="50%" style="stop-color:#18181b"/>
      <stop offset="100%" style="stop-color:#09090b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="50%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Logo/Brand -->
  <text x="100" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="url(#accent)">Echo</text>
  <text x="100" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="36" fill="#a1a1aa">AI Agent Ecosystem</text>
  <!-- Products -->
  <rect x="100" y="320" width="480" height="80" rx="12" fill="rgba(96,165,250,0.1)" stroke="rgba(96,165,250,0.3)" stroke-width="1"/>
  <text x="130" y="370" font-family="system-ui, sans-serif" font-size="24" fill="#e4e4e7">🦀 echo-agent — Rust Framework</text>
  <rect x="100" y="420" width="480" height="80" rx="12" fill="rgba(168,85,247,0.1)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
  <text x="130" y="470" font-family="system-ui, sans-serif" font-size="24" fill="#e4e4e7">🤝 EchoCoWork — AI Agent Product</text>
  <!-- Stats -->
  <text x="700" y="360" font-family="system-ui, sans-serif" font-size="48" font-weight="bold" fill="url(#accent)">67+</text>
  <text x="700" y="400" font-family="system-ui, sans-serif" font-size="18" fill="#71717a">Built-in Tools</text>
  <text x="900" y="360" font-family="system-ui, sans-serif" font-size="48" font-weight="bold" fill="url(#accent)">70</text>
  <text x="900" y="400" font-family="system-ui, sans-serif" font-size="18" fill="#71717a">Examples</text>
  <text x="700" y="480" font-family="system-ui, sans-serif" font-size="48" font-weight="bold" fill="url(#accent)">8</text>
  <text x="700" y="520" font-family="system-ui, sans-serif" font-size="18" fill="#71717a">Crate Modules</text>
  <text x="900" y="480" font-family="system-ui, sans-serif" font-size="48" font-weight="bold" fill="url(#accent)">40+</text>
  <text x="900" y="520" font-family="system-ui, sans-serif" font-size="18" fill="#71717a">Doc Topics</text>
  <!-- URL -->
  <text x="100" y="590" font-family="system-ui, sans-serif" font-size="18" fill="#52525b">echo-agent.dev</text>
</svg>
